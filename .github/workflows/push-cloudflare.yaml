name: Build
permissions:
    contents: read

on:
  push:
    branches: [main, uat, release*]
  workflow_dispatch:

jobs:
  build:
    name: Run production build & deploy
    runs-on: ubuntu-latest
    env:
      # Pin tool versions to avoid upstream updates breaking CI
      WORKER_BUILD_VERSION: "0.8.5"
      WRANGLER_VERSION: "4.82.1"
      # Web Vault frontend (bw_web_builds) version tag (default pinned; override via GitHub Actions Variables)
      # - Set repository variable BW_WEB_VERSION (e.g. v2026.6.4) to override
      # - Set to "latest" to follow the latest bw_web_builds release
      BW_WEB_VERSION: ${{ vars.BW_WEB_VERSION || 'v2026.6.4' }}

      # Required for wrangler
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js (for npx wrangler)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"

      - name: Install Rust toolchain (stable)
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown

      - name: Install lld
        run: sudo apt install -y lld clang gcc llvm

      - name: Install worker-build
        run: |
          set -euo pipefail
          if command -v worker-build &> /dev/null; then
            echo "worker-build already installed: $(worker-build --version || true)"
          fi
          cargo install --locked -q worker-build --version "${WORKER_BUILD_VERSION}"

      - name: Fetch web vault frontend (bw_web_builds)
        run: bash scripts/fetch-web-vault.sh "${BW_WEB_VERSION}"

      - name: Apply D1 migrations
        run: |
          set -euo pipefail
          WRANGLER="npx --yes wrangler@${WRANGLER_VERSION}"
          $WRANGLER d1 migrations apply orangevault --remote

      - uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3
        id: cf
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: npm
          command: deploy
